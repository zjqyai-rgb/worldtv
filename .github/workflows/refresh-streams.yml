# Re-verifies every TV / radio / webcam stream daily and commits the refreshed lists.
# Vercel redeploys automatically when the commit lands, so dead links drop off within a day.
name: Refresh streams

on:
  schedule:
    - cron: '17 */12 * * *' # twice a day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data
      - name: Sanity check (refuse to publish a suspiciously small list)
        run: |
          node -e "
            const n = (f) => require('./public/data/' + f).channels.length;
            const tv = n('tv.json'), radio = n('radio.json'), cams = n('webcams.json');
            console.log({ tv, radio, cams });
            if (tv < 1500 || radio < 2000 || cams < 100) process.exit(1);
          "
      - name: Commit
        run: |
          git config user.name 'worldtv-bot'
          git config user.email 'worldtv-bot@users.noreply.github.com'
          git add public/data
          git diff --cached --quiet || git commit -m 'chore: refresh verified streams'
          git push
